syntax = "proto3";

package ET;

// ResponseType G2R_GetLoginKey
message R2G_GetLoginKey // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
}

message G2R_GetLoginKey // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	
	int64 Key = 4;
	int64 GateId = 5;
}

message G2M_SessionDisconnect // ILocationMessage
{
	int32 RpcId = 1;
}

// Realm 向 LoginCenter进行登录请求
// ResponseType L2R_LoginResponse
message R2L_LoginRequest // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
}

message L2R_LoginResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// LoginCenter 向 Gate 请求断连特定对象
// ResponseType G2L_DisconnectGateUnitResponse
message L2G_DisconnectGateUnitRequest // IRequest
{
	int32 RpcId = 1;

	string Account = 2;
}

message G2L_DisconnectGateUnitResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 账号成功登录网关时向登录中心服进行登记
// ResponseType L2G_AddLoginRecordResponse
message G2L_AddLoginRecordRequest // IRequest
{
	int32 RpcId = 1;

	int64 AccountHash = 2;
	int64 GateId = 3;
}

message L2G_AddLoginRecordResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}
