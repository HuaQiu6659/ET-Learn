syntax = "proto3";

package ET;

// ResponseType NetClient2Main_Login
message Main2NetClient_Login // IRequest
{
	int32 RpcId = 1;
	int32 OwnerFiberId = 2;
	string Address = 3;
	
	string Account = 4;		// 账号
	string Password = 5; 	// 密码
}

message NetClient2Main_Login // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;

	int64 PlayerId = 4;
	string Token = 5;
}

// ResponseType G2C_Ping
message C2G_Ping // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Ping // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 Time = 4;
}

// ResponseType G2C_LoginGate
message C2G_LoginGate // ISessionRequest
{
	int32 RpcId = 1;
	int64 Key = 2;  // 帐号
	int64 GateId = 3;
}

message G2C_LoginGate // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 PlayerId = 4;
}

// ------------ 教程消息 ------------

// 登录请求
// ResponseType R2C_LoginRespose
message C2R_LoginRequest // ISessionRequest
{
	int32 RpcId = 1;

	string Account = 2;
	bool ByVerificationCode = 3;
	string Password = 4; // 密码or验证码
}

message R2C_LoginRespose // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3; 

	string Token = 4;
}

// 验证码请求
// ResponseType R2C_VerificationCodeResponse
message C2R_VerificationCodeRequest // ISessionRequest
{
	int32 RpcId = 1;

	string Receiver = 2;
	bool IsEamil = 3;
}

message R2C_VerificationCodeResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 账号注册请求
// ResponseType R2C_RegisterAccountResponse
message C2R_RegisterAccountRequest // ISessionRequest
{
	int32 RpcId = 1;

	string Account = 2;
	string Password = 3;
	string VerificationCode = 4;
}

message R2C_RegisterAccountResponse // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}
